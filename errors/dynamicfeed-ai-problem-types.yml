problem_types:
- status: 400
  title: Malformed batch body
  occurrences_declared: 0
  observed: true
  remediation: Send {"calls":[{"tool":"<name>","args":{}}]}; the 400 body lists available_tools.
- status: 401
  title: Missing or invalid API key
  occurrences_declared: 0
  observed: true
  applies_to: 'keyed routes: /status, /v1/me, /v1/watchlist, /v1/webhooks, /whats-new, direct feed GETs such as
    /earthquakes'
  remediation: POST /signup for a free key and send it as X-API-Key; or use the keyless /mcp or POST /v1/batch instead.
- status: 402
  title: Payment required (x402)
  occurrences_declared: 0
  observed: true
  applies_to: /v1/pro/batch, /v1/pro/tool/{tool}, /v1/pro/asof; also /v1/asof with a free key ("402 with an upgrade
    pointer")
  remediation: Let an x402 client pay 0.001 USDC on Base and retry with X-PAYMENT; or upgrade the key for /v1/asof.
- status: 422
  title: Validation Error
  occurrences_declared: 112
  observed: false
