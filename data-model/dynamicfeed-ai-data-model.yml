generated: '2026-09-19'
method: searched
source: https://dynamicfeed.ai/schemas/index.json and the 15 JSON Schema documents it links (saved under json-schema/),
  https://dynamicfeed.ai/receipt-spec, the response envelope observed on POST /v1/batch, and openapi/_original/dynamicfeed-ai-openapi.json
summary: 'The REST contract is schema-less on the response side: all 158 operations declare `{}` for 200 and the
  only component schemas are the signup body and the FastAPI validation error, so no entity graph can be derived
  from the OpenAPI. Dynamic Feed publishes its data model elsewhere — as a family of 14 JSON Schema receipt profiles
  (DF-VERIFY/1) plus the OKF reliability object, and as a uniform response envelope (data + provenance + freshness
  + signature + served_by). That published model is recorded here; nothing was invented to fill the OpenAPI gap.'
openapi_schemas:
  count: 3
  names:
  - Body_signup_signup_post
  - HTTPValidationError
  - ValidationError
  response_schemas_declared: 0
envelope:
  name: signed response envelope
  fields:
  - name: data
    type: object
    description: Tool-specific payload.
  - name: provenance
    type: object
    fields:
    - source
    - source_url
    - measured_at
    - license
    - age_seconds
    cardinality: one per datapoint
  - name: freshness
    type: object
    fields:
    - state
    - confidence
    - observed_at
    - age_seconds
    - max_age_seconds
    - reason
  - name: signature
    type: object
    fields:
    - alg
    - key_id
    - canonicalization
    - sig
    references: key_id -> /.well-known/keys and /.well-known/signing-key-registry.json
  - name: served_by
    type: object
    fields:
    - provider
    - url
    - verify
    - verify_scope
    - key_lifecycle
    - facts
    - mcp
    - docs
  - name: reliability
    type: object
    schema: okf-reliability-v1
    fields:
    - confidence
    - basis
    - score
    - sources
    - verified
    - vantage
    - conflict
    - validity
    present_when: facts mode (POST /v1/batch with facts:true, /v1/facts, /v1/answer)
id_style:
  format: opaque hex / integer index
  examples:
    snapshot_id: 32-hex (awareness snapshots)
    notary idx: integer position in the append-only log
    key_id: df-ed25519-<12 hex>
    checkpoint day: YYYY-MM-DD
  prefixes_published: true
  note: Signing keys are prefixed df-ed25519-; API keys observed with an amd_ prefix on the dashboard placeholder.
