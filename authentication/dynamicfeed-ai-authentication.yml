docs: https://dynamicfeed.ai/docs
summary: 'Three access modes on one host, none of them OAuth: (1) keyless — the MCP endpoint, POST /v1/batch and
  the /v1 robot/ground-truth/notary/anchor routes need no credential at all; (2) a static X-API-Key header, issued
  instantly by POST /signup with no card, required for per-user state (watchlist, webhooks, /v1/me), the direct
  per-feed GET routes and /status; (3) x402 payment — /v1/pro/* return HTTP 402 with a USDC-on-Base quote and are
  unlocked by an X-PAYMENT header from an x402 client, no account. The OpenAPI models the key as an optional `x-api-key`
  header parameter on 60 operations (alongside x-rapidapi-proxy-secret / x-rapidapi-user for the RapidAPI marketplace
  channel) rather than as a securityScheme.'
