response_signing:
  note: 'Authentication of the SERVER to the client is the stronger half of this profile: every response is Ed25519-signed
    (DF-VERIFY/1) and the agent card carries a JWS. See conventions/dynamicfeed-ai-conventions.yml response_envelope
    and json-schema/.'
gaps:
- No securitySchemes in the OpenAPI, so generated clients see every route as anonymous.
- No key rotation or revocation endpoint.
- No scoped or restricted keys; one key grants all per-user routes.
- No OAuth/OIDC, so no delegated identity path for agents acting on behalf of a user.
