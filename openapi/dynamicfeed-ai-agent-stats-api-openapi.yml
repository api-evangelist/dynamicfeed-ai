openapi: 3.2.0
info:
  title: Dynamic Feed — Live Data for AI Agent Stats API
  description: Fresh, current data that AI models lack — 20 live domains, 94 read-only tools, over one REST API or a keyless MCP endpoint.
  contact:
    name: Dynamic Feed
    url: https://dynamicfeed.ai/
  version: 1.0.0
servers:
- url: https://dynamicfeed.ai
tags:
- name: Agent Stats
paths:
  /v1/agent-stats:
    get:
      summary: Agent Stats
      description: 'Public, no-PII view of the agent/machine traffic Dynamic Feed serves: tool calls

        (today / 7d / 30d / all-time) and the distinct agent client types seen (Claude, ChatGPT,

        Cursor, LangChain, MCP clients, ...). Counts only — no IPs, no identities. Powers the public

        ''agents tapping us'' counter on /agents. The response itself is Ed25519-signed.'
      operationId: agent_stats_v1_agent_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Agent Stats
