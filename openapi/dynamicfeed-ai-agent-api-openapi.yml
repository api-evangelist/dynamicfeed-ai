openapi: 3.2.0
info:
  title: Dynamic Feed — Live Data for AI Agent API
  description: Fresh, current data that AI models lack — 20 live domains, 94 read-only tools, over one REST API or a keyless MCP endpoint.
  contact:
    name: Dynamic Feed
    url: https://dynamicfeed.ai/
  version: 1.0.0
servers:
- url: https://dynamicfeed.ai
tags:
- name: Agent
paths:
  /v1/discover:
    get:
      tags:
      - Agent
      summary: V1 Discover Get
      description: 'CAPABILITY DISCOVERY — ask in plain words what you need ("live rainfall in Brisbane",

        "sanctions screening", "satellite positions") and get a ranked, Ed25519-signed list of

        candidate capabilities: Dynamic Feed''s own tools with MEASURED 24h uptime/latency and a

        keyless call recipe, plus matching external MCP servers from the official registry index,

        honestly marked registry-reported and unmeasured. Advisory discovery with an explicit

        vantage per candidate, not an endorsement. Keyless.'
      operationId: v1_discover_get_v1_discover_get
      parameters:
      - name: need
        in: query
        required: false
        schema:
          type: string
          maxLength: 300
          default: ''
          title: Need
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 8
          title: Limit
      - name: external
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: External
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Agent
      summary: V1 Discover Post
      description: 'POST twin of GET /v1/discover: {"need": "...", "limit": 8, "external": true}.'
      operationId: v1_discover_post_v1_discover_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /schemas/index.json:
    get:
      tags:
      - Agent
      summary: Schemas Index
      description: 'The Dynamic Feed receipt-schema family, self-describing (DF-VERIFY/1). Scans the schema

        directory at request time so it never drifts: every profile''s $id, title and active mint

        endpoint when one exists. Deprecated/quarantined schemas remain visible as history, not as

        executable capabilities. Schema conformance and signature mathematics are separate from

        lifecycle acceptance.'
      operationId: schemas_index_schemas_index_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/bundles:
    get:
      tags:
      - Agent
      summary: V1 Bundles
      description: 'Curated tool BUNDLES per domain — pick the right tools for your agent''s use-case fast (instead of

        sifting all tools). Keyless: call any tool via POST /v1/batch; pay-per-call via /v1/pro/*.'
      operationId: v1_bundles_v1_bundles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/bundles/{bundle_id}:
    get:
      tags:
      - Agent
      summary: V1 Bundle
      description: One curated tool bundle by id (e.g. devsecops, weather-climate, finance-markets).
      operationId: v1_bundle_v1_bundles__bundle_id__get
      parameters:
      - name: bundle_id
        in: path
        required: true
        schema:
          type: string
          title: Bundle Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/batch:
    post:
      tags:
      - Agent
      summary: V1 Batch
      description: 'Run up to 20 read-only data-tool calls in ONE request — cuts agent round-trips. Keyless.

        Body: {"calls":[{"tool":"current_weather","args":{"city":"London"}}, {"tool":"earthquakes","args":{}}]}.

        Returns {"results":[{"tool","ok","data"|"error"}, ...]} in the same order. Tool names are the keyless

        MCP tools; POST with no `calls` returns the available list. Each call has its own 20s deadline, so a

        slow upstream degrades that one item rather than blocking the batch.


        Add "facts": true to the body to get each result as a canonical, reliability-graded fact instead of

        raw data: {"tool","ok","fact":{value, provenance, verification, reliability{confidence,basis,sources,

        verified,vantage,conflict}}}. The whole response is Ed25519-signed (verify against /.well-known/keys),

        so this is verifiable, reliability-graded, multi-tool data in one round-trip. Default shape is unchanged.'
      operationId: v1_batch_v1_batch_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/pro/tool/{tool}:
    post:
      tags:
      - Agent
      summary: V1 Pro Tool
      description: 'PREMIUM single signed tool call — pay-per-call (x402, USDC on Base) for ANY one of Dynamic Feed''s

        live tools. An agent pays once, gets one Ed25519-signed datapoint. No signup, no human. Body:

        {"args":{...}}. Discoverable via the x402 bazaar. (Free alternative: keyless /v1/batch, fair-use.)'
      operationId: v1_pro_tool_v1_pro_tool__tool__post
      parameters:
      - name: tool
        in: path
        required: true
        schema:
          type: string
          title: Tool
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Agent
      summary: V1 Pro Tool Discover
      description: 'Discovery for the paid single-call endpoint. A GET returns the x402 402 challenge — so an agent that

        probes with GET (instead of a ''Method Not Allowed'' dead end) still learns the price, the asset, and that

        it must POST with an X-PAYMENT header + {"args":{...}} body. NO payment is taken on GET; settlement only

        ever happens on POST. Pure discovery, no money path.'
      operationId: v1_pro_tool_discover_v1_pro_tool__tool__get
      parameters:
      - name: tool
        in: path
        required: true
        schema:
          type: string
          title: Tool
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pro/asof:
    post:
      tags:
      - Agent
      summary: V1 Pro Asof
      description: 'PREMIUM keyless AS-OF REPLAY — pay-per-call (x402, USDC on Base) signed time-machine over Dynamic

        Feed''s append-only archive. Body {"tool":"current_weather","t":"2026-06-10T14:30:00Z"} (or ?tool=&t=)

        -> the archived observation for `tool` nearest at-or-before `t`, replayed VERBATIM, Ed25519-signed

        (verify against GET /.well-known/keys). The keyless paid channel to the SAME engine as the key-gated

        GET /v1/asof — for agent backtesting, audit trails and ''what did we know when we decided'' disputes.

        No signup, no human; discoverable via the x402 bazaar. Honest about coverage: a time the archive

        didn''t capture returns a clear miss, never a fabricated past.'
      operationId: v1_pro_asof_v1_pro_asof_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/pro/batch:
    post:
      tags:
      - Agent
      summary: V1 Pro Batch
      description: 'PREMIUM, pay-per-call data batch — the commercial tier of /v1/batch, paid AGENT-NATIVELY via x402

        (HTTP 402): an agent gets a price, pays from its wallet, re-calls with the X-PAYMENT header, and is

        served — no human, no signup. Up to 100 signed tool calls per request (free /v1/batch is fair-use,

        capped at 20). Dynamic Feed charges for its OWN service; a third-party facilitator settles the payment

        — DF never custodies funds (witness-not-money). Body: {"calls":[{"tool":...,"args":{...}}, ...]}.'
      operationId: v1_pro_batch_v1_pro_batch_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/pro/catalog:
    get:
      tags:
      - Agent
      summary: V1 Pro Catalog
      description: 'Machine-readable MENU of Dynamic Feed''s x402 pay-per-call SKUs (USDC on Base) — the ''price list''

        an agent or x402 facilitator shops in one call: every paid endpoint, its price (live from

        X402_PRICE_ATOMIC), input/output schema, the recipient wallet (when connected), and the facilitator.

        Boundary: DF is the merchant; the facilitator settles — DF never custodies funds.'
      operationId: v1_pro_catalog_v1_pro_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/drift:
    post:
      tags:
      - Agent
      summary: V1 Drift
      description: 'Drift detection — audit an AI''s stated facts against live ground-truth, graded by severity. Keyless.

        Body: {"claims":["The latest Python is 3.11","Node.js is on 18"]} or {"text":""}.

        Returns {checked, drifted_count, overall, results:[{claim, status, drifted, severity, correction, source}]}.'
      operationId: v1_drift_v1_drift_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/guard:
    post:
      tags:
      - Agent
      summary: V1 Guard
      description: 'Pre-answer guard — the anti-hallucination middleware. POST the draft answer your AI is about to

        send; get back a verdict of "pass" or "revise" plus the exact corrections, so you can fix it BEFORE

        the user sees it. Keyless. Wrap it around any LLM response pipeline.

        Body: {"answer":""} or {"claims":["...","..."]}.

        Returns {verdict:"pass"|"revise", checked, issues:[{claim, subject, severity, correction, source}],

        confirmed, unverifiable, guidance}. Only claims that CONTRADICT live data trigger "revise"; opinions

        and facts no live feed can cover pass through untouched. Verifies prices, software versions, market

        open/closed and service up/down against Dynamic Feed''s live ground-truth.'
      operationId: v1_guard_v1_guard_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/sources:
    get:
      tags:
      - Agent
      summary: V1 Sources
      description: 'The authoritative source catalog — every upstream feed Dynamic Feed serves, with its publisher,

        official URL, licence, whether commercial use + redistribution is permitted, update cadence, and the

        tools it backs. Keyless. Each datapoint is provenance-stamped (source, licence, timestamp) so you can

        cite it and verify usage rights yourself.'
      operationId: v1_sources_v1_sources_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/explain:
    get:
      tags:
      - Agent
      summary: V1 Explain
      description: 'Explain the source / chain of custody for one subject. Pass ?subject= (GET) or {"subject":"..."}

        (POST) — a tool name (earthquakes), a source (USGS), or a topic. Returns the upstream source(s),

        licence, official URL, update cadence and the full custody trail (origin -> ingest -> normalize ->

        serve, plus sign/anchor for awareness), so you can trace and verify where a number came from. Keyless.'
      operationId: v1_explain_v1_explain_get
      parameters:
      - name: subject
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Subject
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Agent
      summary: V1 Explain
      description: 'Explain the source / chain of custody for one subject. Pass ?subject= (GET) or {"subject":"..."}

        (POST) — a tool name (earthquakes), a source (USGS), or a topic. Returns the upstream source(s),

        licence, official URL, update cadence and the full custody trail (origin -> ingest -> normalize ->

        serve, plus sign/anchor for awareness), so you can trace and verify where a number came from. Keyless.'
      operationId: postV1Explain
      parameters:
      - name: subject
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Subject
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: v1_explain_v1_explain_get
  /v1/snapshot:
    get:
      tags:
      - Agent
      summary: V1 Snapshot
      description: 'Historical world-state — what Dynamic Feed reported on a given day. ?date=YYYY-MM-DD returns that

        day''s stored snapshot (the cross-domain world_pulse digest); no date returns today''s, captured on

        read. Honest about coverage: a date before the earliest snapshot returns the available range, never

        a fabricated past. Keyless. The auditable companion to the signed/RFC 3161 timestamped awareness layer.'
      operationId: v1_snapshot_v1_snapshot_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/asof:
    get:
      tags:
      - Agent
      summary: V1 Asof
      description: 'TIME-MACHINE REPLAY — what did the data say at decision time? Returns the archived observation

        for `tool` nearest at-or-before time `t`, replayed VERBATIM from Dynamic Feed''s append-only archive

        (capturing every served datapoint since 2026-06-07) — the value as served then, never a re-fetch or

        reconstruction. The response carries honest metadata (`archived_at`, `distance_seconds` from your

        requested instant, the exact archive object, where coverage begins) and is Ed25519-signed (verify

        against GET /.well-known/keys) — built for agent backtesting, audit trails and "what did we know

        when we decided" disputes. Honest about coverage: a time the archive didn''t capture returns a clear

        miss with the nearest captured day, never a fabricated past. Paid plans (Pro and up); auth via the

        X-API-Key header. Upgrade: https://dynamicfeed.ai/dashboard'
      operationId: v1_asof_v1_asof_get
      parameters:
      - name: tool
        in: query
        required: true
        schema:
          type: string
          description: tool name, e.g. current_weather (the keyless MCP tool names)
          title: Tool
        description: tool name, e.g. current_weather (the keyless MCP tool names)
      - name: t
        in: query
        required: true
        schema:
          type: string
          description: ISO-8601 timestamp, e.g. 2026-06-10T14:30:00Z
          title: T
        description: ISO-8601 timestamp, e.g. 2026-06-10T14:30:00Z
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: x-rapidapi-proxy-secret
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-Proxy-Secret
      - name: x-rapidapi-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-User
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/watchlist:
    get:
      tags:
      - Agent
      summary: V1 Watchlist Get
      description: 'Your saved watchlist — the subjects/tools you monitor. ?pull=true runs every watched tool and

        returns each one''s CURRENT value in a single call (your whole dashboard at once). Per-user, keyed by

        your API key (X-API-Key).'
      operationId: v1_watchlist_get_v1_watchlist_get
      parameters:
      - name: pull
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Pull
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: x-rapidapi-proxy-secret
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-Proxy-Secret
      - name: x-rapidapi-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-User
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Agent
      summary: V1 Watchlist Post
      description: 'Add to or replace your watchlist. Body {"label":"BTC","tool":"cite","args":{"subject":"BTC"}} adds

        one item; body {"items":[...]} replaces the whole list (max 25). Each item''s `tool` must be a real

        Dynamic Feed tool. Per-user, keyed by your API key.'
      operationId: v1_watchlist_post_v1_watchlist_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: x-rapidapi-proxy-secret
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-Proxy-Secret
      - name: x-rapidapi-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-User
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agent
      summary: V1 Watchlist Delete
      description: Remove one item from your watchlist (?label=BTC) or clear it entirely (no label). Per-user.
      operationId: v1_watchlist_delete_v1_watchlist_delete
      parameters:
      - name: label
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Label
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: x-rapidapi-proxy-secret
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-Proxy-Secret
      - name: x-rapidapi-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-User
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stream:
    get:
      tags:
      - Agent
      summary: V1 Stream
      description: 'Server-Sent Events stream of a LIVE value. Point an EventSource at

        /v1/stream?tool=&args=&interval=&count= and receive the tool''s current value every

        `interval` seconds as a `value` event, until `count` updates or you disconnect. Keyless. Bounded for

        fair use: interval 5-300s, count 1-60. Example: /v1/stream?tool=cite&args={"subject":"BTC"}&interval=10'
      operationId: v1_stream_v1_stream_get
      parameters:
      - name: tool
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Tool
      - name: args
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Args
      - name: interval
        in: query
        required: false
        schema:
          type: number
          default: 15
          title: Interval
      - name: count
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Count
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/webhooks:
    post:
      tags:
      - Agent
      summary: V1 Webhooks Create
      description: 'Register a webhook that fires when a tool''s value CHANGES. Body:

        {"url":"https://you.example/hook","tool":"exploited_vulnerabilities","args":{}}. The URL is validated

        SSRF-safe (public http/https only). Returns a one-time `secret` — every delivery is HMAC-SHA256 signed

        with it (header X-DynamicFeed-Signature: sha256=…), so you can verify it came from us. Per-user (X-API-Key).'
      operationId: v1_webhooks_create_v1_webhooks_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: x-rapidapi-proxy-secret
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-Proxy-Secret
      - name: x-rapidapi-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-User
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Agent
      summary: V1 Webhooks List
      description: List your webhook subscriptions (secrets are never returned). Per-user.
      operationId: v1_webhooks_list_v1_webhooks_get
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: x-rapidapi-proxy-secret
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-Proxy-Secret
      - name: x-rapidapi-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-User
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agent
      summary: V1 Webhooks Delete
      description: Delete one of your webhook subscriptions by ?id=. Per-user.
      operationId: v1_webhooks_delete_v1_webhooks_delete
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: x-rapidapi-proxy-secret
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-Proxy-Secret
      - name: x-rapidapi-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-User
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/webhooks/test:
    post:
      tags:
      - Agent
      summary: V1 Webhooks Test
