openapi: 3.2.0
info:
  title: Dynamic Feed — Live Data for AI Movers API
  description: Fresh, current data that AI models lack — 20 live domains, 94 read-only tools, over one REST API or a keyless MCP endpoint.
  contact:
    name: Dynamic Feed
    url: https://dynamicfeed.ai/
  version: 1.0.0
servers:
- url: https://dynamicfeed.ai
tags:
- name: Movers
paths:
  /movers:
    get:
      summary: Movers
      description: 'DERIVED signal — biggest 24h gainers or losers across the markets we track. Computed from

        Dynamic Feed''s own data & recorded history (not a raw source you can scrape). (Requires API key.)'
      operationId: movers_movers_get
      parameters:
      - name: direction
        in: query
        required: false
        schema:
          type: string
          description: gainers | losers
          default: gainers
          title: Direction
        description: gainers | losers
      - name: asset_class
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: crypto | stock | index | forex | commodity | metal
          title: Asset Class
        description: crypto | stock | index | forex | commodity | metal
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 15
          title: Limit
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: x-rapidapi-proxy-secret
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-Proxy-Secret
      - name: x-rapidapi-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Rapidapi-User
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Movers
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
