standards:
- id: openapi-3.1
  name: OpenAPI 3.1.0
  conforms: true
  evidence: https://dynamicfeed.ai/openapi.json (HTTP 200, application/json) declares "openapi":"3.1.0" with 148
    paths / 158 operations; a second 3.1.0 document is served at /openapi-agent-public.json. Saved verbatim under
    openapi/_original/.
  caveat: Every 200 response declares an empty schema ({}), there are no securitySchemes, and 45 operations are
    untagged — a FastAPI auto-export, not a curated contract.
- id: mcp-2025-06-18
  name: Model Context Protocol (protocolVersion 2025-06-18, Streamable HTTP)
  conforms: true
  evidence: POST https://dynamicfeed.ai/mcp initialize returned protocolVersion 2025-06-18, serverInfo {Dynamic
    Feed 0.8.0}; tools/list returned 94 tools with inputSchema. Server card at /.well-known/mcp.json.
- id: a2a-1.0
  name: A2A Protocol 1.0 Agent Card
  conforms: true
  evidence: 'https://dynamicfeed.ai/.well-known/agent-card.json (200) graded conformant in a2a/dynamicfeed-ai-a2a.yml:
    capabilities object, protocolVersion "1.0", skills array of 8, JWS signature.'
  caveat: Uses the 0.3-era top-level url/preferredTransport rather than supportedInterfaces[].
- id: x402
  name: x402 HTTP 402 payment protocol (x402Version 1, exact scheme, USDC on Base)
  conforms: true
  evidence: 'POST https://dynamicfeed.ai/v1/pro/tool/current_time without payment returned HTTP 402 with a valid
    x402 body: x402Version 1, accepts[].scheme exact, network base, maxAmountRequired 1000 (0.001 USDC), payTo 0xb525F2c54Ae0c3B3466206694726f85C7Cf7b985,
    asset 0x8335…2913 (USDC), plus the bazaar discovery extension; access-control-expose-headers: X-PAYMENT-RESPONSE.
    Menu at GET /v1/pro/catalog; rail status /v1/pro/diag reports enabled + can_settle.'
- id: rfc9116
  name: RFC 9116 security.txt
  conforms: true
  evidence: https://dynamicfeed.ai/.well-known/security.txt returned 200 text/plain with Contact, Expires (2027-06-03),
    Preferred-Languages, Canonical and Policy fields; also served at /security.txt.
  caveat: Policy points at /terms, which is a Terms of Service, not a vulnerability-disclosure policy; no Encryption
    or Acknowledgments field.
- id: rfc7517
  name: RFC 7517 JSON Web Key Set
  conforms: true
  evidence: https://dynamicfeed.ai/.well-known/jwks.json returned a valid JWK Set with one EC P-256 key (kid dynamicfeed-agntcy-cosign-1).
  caveat: The data-signing keys are Ed25519 and published in a non-JWKS map at /.well-known/keys; the JWKS carries
    a different (co-signing) key.
- id: jose-jws
  name: JWS (RFC 7515) EdDSA signature on the agent card
  conforms: true
  evidence: agent-card.json signatures[0].protected decodes to {"alg":"EdDSA","kid":"df-ed25519-6ca0de29113b","typ":"JOSE"}.
- id: openai-plugin-manifest
  name: OpenAI ai-plugin.json manifest v1
  conforms: true
  evidence: https://dynamicfeed.ai/.well-known/ai-plugin.json (200) with schema_version v1, auth.type none, api.type
    openapi -> /openapi-agent-public.json.
- id: ard-1.0
  name: Agentic Resource Discovery (ARD) ai-catalog specVersion 1.0
  conforms: true
  evidence: https://dynamicfeed.ai/.well-known/ai-catalog.json (200) with specVersion 1.0, host.trustManifest and
