  description: 'The full REST surface: 158 operations on https://dynamicfeed.ai — the keyless POST /v1/batch tool
    dispatcher (up to 20 calls per request, each result Ed25519-signed with provenance and freshness), legacy per-feed
    GET routes, the /v1 agent and robot surface (awareness verdicts, drift/guard ground-truth checks, receipts,
    witness, notary log, checkpoints, RFC 3161 anchor, watchlist, webhooks, SSE stream), free-key signup and the
    x402 pay-per-call /v1/pro endpoints. Published as OpenAPI 3.1.0 at /openapi.json with a second one-operation
    public-agent spec at /openapi-agent-public.json.'
