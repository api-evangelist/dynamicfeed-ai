- aid: dynamicfeed-ai:dynamic-feed-webhooks-and-stream
  name: Dynamic Feed Webhooks and Live Stream
  description: Push-on-change webhooks registered per key at POST /v1/webhooks (SSRF-validated URL, one-time secret,
    HMAC-SHA256 X-DynamicFeed-Signature on every delivery) and a keyless Server-Sent Events stream at GET /v1/stream
    that pushes a tool's live value every 5-300 seconds for up to 60 updates. No AsyncAPI is published; the surface
    is documented in prose and operation descriptions.
  humanURL: https://dynamicfeed.ai/llms.txt
