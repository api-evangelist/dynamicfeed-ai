aid: dynamicfeed-ai
name: Dynamic Feed
description: 'Dynamic Feed, a product of Fluxdyne Pty Ltd (Australia), is a live-data and machine-evidence layer
  for AI agents and robots: 94 read-only tools across 20 domains (weather and air quality, natural hazards, space
  weather and satellite positions, CVEs and actively-exploited vulnerabilities, software versions and EOL, sanctions
  and Federal Register, shipping, macro and rates, AI-model pricing and provider latency) drawn from named public
  sources such as NASA, NOAA, USGS, CISA, OFAC and the World Bank plus its own measurements. Every response carries
  a provenance and freshness envelope and a detached Ed25519 signature (DF-VERIFY/1) verifiable offline against
  published keys. The same tool registry is served three ways from one host: a keyless MCP server at /mcp (Streamable
  HTTP, protocol 2025-06-18), an A2A 1.0 agent at /a2a with a conformant signed agent card, and a REST API published
  as OpenAPI 3.1 with a keyless 20-call batch endpoint. A /v1 surface adds robot go/caution/no-go awareness verdicts,
  RFC 3161 anchoring, signed transaction/inference/robot/eval receipts on an append-only notary log with daily checkpoints,
  per-key watchlists, HMAC-signed change webhooks and an SSE stream. Paid access is machine-native via x402 (HTTP
  402, USDC on Base, 0.001 USDC per call).'
