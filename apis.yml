- aid: dynamicfeed-ai:dynamic-feed-mcp-server
  name: Dynamic Feed MCP Server
  description: Hosted, keyless Model Context Protocol server at https://dynamicfeed.ai/mcp (Streamable HTTP with
    legacy HTTP+SSE auto-detected; explicit SSE at /sse) exposing all 94 read-only live-data tools with real inputSchemas;
    anonymous initialize and tools/list verified live (protocolVersion 2025-06-18, server 0.8.0). A first-party
    stdio bridge ships as npm/PyPI dynamicfeed-mcp. Server card at /.well-known/mcp.json.
