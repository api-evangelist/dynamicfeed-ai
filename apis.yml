- aid: dynamicfeed-ai:dynamic-feed-a2a-agent
  name: Dynamic Feed A2A Agent
  description: A2A 1.0 JSON-RPC agent at https://dynamicfeed.ai/a2a with a JWS-signed agent card (graded conformant)
    declaring eight keyless skills — live weather, natural hazards, macro and rates, security intel, compliance
    screening, space and orbit, verifiable facts, robot awareness — each grouping tools from the same 94-tool registry
    the MCP server exposes. A provenance extension URI marks every result artifact as Ed25519-signed.
  humanURL: https://dynamicfeed.ai/agents
  baseURL: https://dynamicfeed.ai/a2a
