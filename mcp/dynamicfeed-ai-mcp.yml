gaps:
- Tool descriptions are long prose (several hundred characters each) and carry no annotations block (readOnlyHint
  etc.), so read-only-ness is stated in prose, not in MCP annotations.
- The stdio package on npm was last published 2026-06-11 (1.0.1) and its GitHub README says 62 tools while the hosted
  server exposes 94; the bridge is a thin proxy so it likely forwards all tools, but its metadata is stale.
- No OAuth/RFC 9728 protected-resource metadata is published — expected for a keyless server, but it means a client
  cannot discover an auth path if fair-use limits are later enforced.
