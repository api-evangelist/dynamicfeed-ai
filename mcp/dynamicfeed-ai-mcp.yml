  ALSO ships a first-party stdio bridge (npm dynamicfeed-mcp / PyPI dynamicfeed-mcp) for clients that cannot reach
  remote servers. Anonymous initialize and tools/list both succeeded: protocolVersion 2025-06-18, serverInfo {name:
  Dynamic Feed, version: 0.8.0}, 94 tools each carrying a real inputSchema; prompts/list and resources/list return
  empty arrays. Every tool result is returned in an Ed25519-signed provenance envelope (source, licence, measured_at,
  age_seconds, freshness) verifiable against /.well-known/keys.'
