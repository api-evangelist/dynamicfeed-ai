rest_only_note: 'Operations with no MCP tool: the agent/robot v1 surface (awareness, preflight, road, humanoid,
  marine verdicts; receipts, witness, notary log, checkpoints, anchoring; watchlist, webhooks, SSE stream; signup/me;
  x402 pro endpoints; billing) and the open-dataset JSON snapshots. These are REST-first by design — writes and
  per-user state are deliberately kept off the keyless MCP surface.'
