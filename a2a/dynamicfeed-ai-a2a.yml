conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: 'All three hard checks pass: capabilities is an OBJECT carrying streaming, pushNotifications, stateTransitionHistory
    and an extensions[] array; protocolVersion "1.0" is present at the top level; skills is an ARRAY of eight fully-populated
    skills, each with id, name, description, tags, examples, inputModes and outputModes. All three optional discriminators
    are present (preferredTransport, defaultInputModes, defaultOutputModes), so the card grades conformant rather
    than near-conformant.'
  deviations:
  - field: url / preferredTransport / protocolVersion
    observed: declared as the 0.3-era top-level triple; no supportedInterfaces[] array
    note: A2A 1.0.0 moved the interface declaration into supportedInterfaces[].protocolBinding. The card still passes
      every hard check because protocolVersion IS present at the top level, but a strict 1.0 reader looking only
      at supportedInterfaces[] finds no interface. Both shapes coexist in the wild; recorded for interoperability,
      not as a spec failure.
  - field: securitySchemes / security
    observed: absent
    note: 'Consistent with the provider: every A2A skill is keyless fair-use. There is no auth scheme to declare
      and none is declared.'
  - field: capabilities.extensions[1] (ground-truth/v1)
    observed: declared with description "SECURITY QUARANTINE ... POST /v1/vc returns 503"
    note: 'The card advertises an extension whose backing endpoint is disabled. It is honest (required: false, and
      the description says so) but an agent that reads only the uri list will discover a dead capability.'
  - field: skills[].examples
    observed: JSON strings shaped {"tool":..., "args":...}
    note: Examples are MCP-style tool invocations serialized as strings, which tells an agent that the A2A surface
      dispatches to the same 94-tool registry as /mcp and /v1/batch rather than exposing A2A-native task types.
surface_relationship:
  note: 'Dynamic Feed exposes ONE tool registry over three agent surfaces on one host: A2A JSON-RPC at https://dynamicfeed.ai/a2a
    (8 skills that group the tools), MCP Streamable HTTP at https://dynamicfeed.ai/mcp (94 tools, keyless, live
    tools/list succeeded), and REST at https://dynamicfeed.ai (158 operations; POST /v1/batch dispatches any tool
    by name). The A2A skills are groupings of MCP tool names, so the crosswalk in mcp/dynamicfeed-ai-tool-crosswalk.yml
    covers all three.'
